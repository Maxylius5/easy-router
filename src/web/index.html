<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Easy Router</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>Easy Router</h1>
            <p>Network management dashboard</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            System online
        </div>
    </header>


    <main>

        <section>
            <div class="section-header">
                <div>
                    <h2>Network Interfaces</h2>
                    <p>Hardware and interfaces detected on this machine.</p>
                </div>

                <button id="refresh-button">
                    Refresh
                </button>
            </div>

            <div id="interfaces" class="interfaces">
                <p class="loading">Scanning interfaces...</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
